# Lexari MAINNET web app on mainnet.lexari.ai -> 127.0.0.1:3212 (pm2 lexari-mainnet-webapp, /opt/lexari-mainnet).
# Its own file and server block; the testnet vhosts in /etc/nginx/sites-available/lexari are not touched.
# HTTP only until DNS points here; then: certbot --nginx -d mainnet.lexari.ai (adds the 443 block and redirect).
limit_req_zone $binary_remote_addr zone=lxm_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=lxm_stepup:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name mainnet.lexari.ai;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location ^~ /api/auth/ {
        limit_req zone=lxm_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/security/stepup {
        limit_req zone=lxm_stepup burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
